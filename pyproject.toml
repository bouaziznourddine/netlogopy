[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netlogopy"
dynamic = ["version"]
description = "Bridge NetLogo and Python for advanced agent-based simulations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nourddine Bouaziz", email = "nourddine.bouaziz.dz@gmail.com" }
]
requires-python = ">=3.6"
dependencies = ["JPype1>=1.0"]
keywords = ["python", "netlogo", "simulation", "multi-agent", "agent-based modeling", "ABM"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=6"]

[project.urls]
Homepage = "https://github.com/bouaziznourddine/netlogopy"
"Bug Tracker" = "https://github.com/bouaziznourddine/netlogopy/issues"
"Source Code" = "https://github.com/bouaziznourddine/netlogopy"
Changelog = "https://github.com/bouaziznourddine/netlogopy/blob/main/CHANGELOG.md"
Paper = "https://doi.org/10.36819/SW25.019"

[tool.setuptools]
packages = ["netlogopy"]

[tool.setuptools.dynamic]
version = { attr = "netlogopy.__version__" }

[tool.setuptools.package-data]
netlogopy = ["*.nlogo", "*.nls", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
