[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netlogopy"
dynamic = ["version"]
description = "Drive NetLogo models from Python: agents, patches, links, plots, experiments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nourddine Bouaziz", email = "nourddine.bouaziz.dz@gmail.com" }
]
requires-python = ">=3.8"
dependencies = ["JPype1>=1.5"]
keywords = ["python", "netlogo", "simulation", "multi-agent", "agent-based modeling", "ABM"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.optional-dependencies]
data = ["numpy", "pandas"]
test = ["pytest>=6"]

[project.urls]
Homepage = "https://github.com/bouaziznourddine/netlogopy"
"Bug Tracker" = "https://github.com/bouaziznourddine/netlogopy/issues"
"Source Code" = "https://github.com/bouaziznourddine/netlogopy"
Changelog = "https://github.com/bouaziznourddine/netlogopy/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["netlogopy"]

[tool.setuptools.dynamic]
version = { attr = "netlogopy.__version__" }

[tool.setuptools.package-data]
netlogopy = ["*.nlogo", "*.nlogox", "*.nls", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The JVM handles access violations internally on Windows; pytest's
# faulthandler would print them as crashes.
addopts = "-p no:faulthandler"
markers = [
    "netlogo: needs NetLogo and a Java runtime (skipped when they are missing)",
    "examples: runs the example scripts headless (slow)",
]

[tool.ruff]
line-length = 120
target-version = "py38"
extend-exclude = ["Examples", "journal-paper"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B905"]                  # zip(strict=) needs Python 3.10; netlogopy supports 3.8

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]               # reading a property to check that it raises

[tool.coverage.run]
source = ["netlogopy"]
omit = ["netlogopy/__main__.py"]
