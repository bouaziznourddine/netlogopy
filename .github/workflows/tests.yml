name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # setup-python no longer provides 3.9 on the newest Ubuntu image
          - os: ubuntu-22.04
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Unit tests (NetLogo is not installed, so its tests are skipped)
        run: python -m pytest -q

  netlogo:
    name: NetLogo ${{ matrix.netlogo }} (headless, Linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        netlogo: ["6.4.0", "7.0.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache NetLogo
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/netlogo
          key: netlogo-${{ matrix.netlogo }}-linux
      - name: Download NetLogo
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/netlogo
          curl -fsSL "https://downloads.netlogo.org/${{ matrix.netlogo }}/NetLogo-${{ matrix.netlogo }}-64.tgz" | tar xz -C ~/netlogo
      - name: Install
        run: python -m pip install -e ".[test,data]" pytest-cov
      - name: Tests with NetLogo, examples included, with coverage
        run: |
          export NETLOGO_HOME="$(ls -d ~/netlogo/*/ | head -n 1)"
          python -m netlogopy
          python -m pytest -q --cov=netlogopy --cov-report=term

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check netlogopy tests tools

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python tools/readme_links.py absolute
      - run: python -m build
      - run: python -m twine check dist/*
