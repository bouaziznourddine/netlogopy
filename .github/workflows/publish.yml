name: publish

# Publishes netlogopy on PyPI when a GitHub release is published, with PyPI
# trusted publishing (no API token stored on GitHub).
#
# One-time setup on pypi.org, project netlogopy > Settings > Publishing >
# "Add a new publisher" (GitHub): owner bouaziznourddine, repository netlogopy,
# workflow publish.yml, environment pypi.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wheel and the sdist
        run: |
          python -m pip install build twine
          python tools/readme_links.py absolute   # PyPI shows the README outside the repository
          python -m build
          python -m twine check --strict dist/*
      - name: The version matches the release tag
        if: github.event_name == 'release'
        run: |
          version="$(python -c 'import netlogopy; print(netlogopy.__version__)')"
          tag="${GITHUB_REF_NAME#v}"
          echo "package $version, tag $GITHUB_REF_NAME"
          test "$version" = "$tag"
      - name: The wheel installs with its model files
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          cd /tmp && /tmp/check/bin/python "$GITHUB_WORKSPACE/tools/check_wheel.py"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: [build, tests]
    # Manual runs only build; uploading needs a published release.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/netlogopy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
