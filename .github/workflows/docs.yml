name: docs

# Builds the documentation site with MkDocs Material and publishes it on
# GitHub Pages (Settings > Pages > Source: "GitHub Actions").

on:
  push:
    branches: [main]
  pull_request:
    paths: ["docs/**", "overrides/**", "Examples/**", "mkdocs.yml", "netlogopy/**", "README.md", "CHANGELOG.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install MkDocs
        run: python -m pip install -r docs/requirements.txt
      - name: Build the site (warnings are errors)
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
